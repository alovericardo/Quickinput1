name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.8.0"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.* --default-timeout=120
      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # ✅关键：不要cd source！pro文件在仓库根目录！
      - name: 项目编译
        run: |
          qmake -spec win32-msvc CONFIG+=release
          nmake release

      # 编译产物输出在 release 文件夹（仓库根目录下release）
      - name: 打包Qt运行依赖
        run: |
          cd release
          windeployqt *.exe

      - name: 上传可执行程序
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-Win-x64
          path: release/**/*
