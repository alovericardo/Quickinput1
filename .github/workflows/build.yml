name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.8.0"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.* --default-timeout=120

      - name: 安装Qt6
        id: qt_install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: MSBuild编译Release x64
        run: |
          $qtMsBuild = "$env:QT_INSTALL_DIR\msbuild"
          msbuild QuickInput.sln /p:Configuration=Release /p:Platform=x64 /p:QtMsBuildPath="$qtMsBuild"
        env:
          QT_INSTALL_DIR: ${{ steps.qt_install.outputs.QT_INSTALL_DIR }}

      - name: windeployqt拷贝Qt依赖dll
        run: |
          cd x64/Release
          windeployqt *.exe

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-Win-x64
          path: x64/Release/**/*
