name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.8.0"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.* --default-timeout=120

      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # 进入source子目录，源码全部放在source文件夹
      - name: 进入源码目录，qmake生成构建文件
        run: |
          cd source
          qmake -spec win32-msvc CONFIG+=release

      - name: nmake编译Release
        run: |
          cd source
          nmake release

      # 部署全部Qt依赖dll
      - name: windeployqt打包运行库
        run: |
          cd source/release
          windeployqt *.exe

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-Win-x64
          path: source/release/**/*
