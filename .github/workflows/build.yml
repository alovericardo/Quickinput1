name: QuickInput-CI
# 并发控制：旧任务自动取消，避免队列拥堵
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.7.2"
      QT_ARCH: "win64_msvc2022_64"
      # 删除本地D盘路径，云端自动管理依赖目录
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装修复版aqtinstall
        run: |
          python -m pip install git+https://github.com/miurahr/aqtinstall.git@master

      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
