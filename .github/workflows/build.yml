name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.7.2"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 改动：从PyPI直接安装正式版aqtinstall，不再拉取GitHub源码，避开网络问题
      - name: 安装aqtinstall
        run: python -m pip install aqtinstall

      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
