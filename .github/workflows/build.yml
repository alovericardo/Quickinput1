name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.8.0"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.* --default-timeout=120

      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # 明确指定解决方案全名，不再使用通配符
      - name: MSBuild编译Release版本
        run: msbuild QuickInput.sln /p:Configuration=Release /p:Platform=x64

      # 云端自动打包Qt全部依赖库
      - name: 补全Qt运行依赖
        run: |
          Get-ChildItem ./x64/Release/*.exe | ForEach-Object { windeployqt $_.FullName }

      - name: 上传完整程序包
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-Win-x64
          path: x64/Release/**/*
