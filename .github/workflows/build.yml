name: QuickInput-CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      QT_VERSION: "6.8.0"
      QT_ARCH: "win64_msvc2022_64"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.* --default-timeout=120

      - name: 安装Qt6
        id: qt_install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: 添加Qt bin到PATH
        env:
          QT_INSTALL_DIR: ${{ steps.qt_install.outputs.QT_INSTALL_DIR }}
        run: |
          echo "$env:QT_INSTALL_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 临时生成项目pro文件（云端本地，不提交仓库）
        run: |
          "QT += core gui widgets network`nSOURCES += source/main.cpp source/src/action.cpp source/src/func.cpp source/src/init.cpp source/src/input.cpp source/src/interpreter.cpp source/src/json.cpp source/src/lang.cpp source/src/macro.cpp source/src/scriptinterpreter.cpp source/src/thread.cpp source/src/trigger.cpp source/src/type.cpp source/ui/MsgViewUi.cpp source/ui/VarViewUi.cpp source/ui/UpdateUi.cpp source/ui/TriggerUi.cpp source/ui/SettingsUi.cpp source/ui/RecordUi.cpp source/ui/PopsUi.cpp source/ui/HelpUi.cpp source/ui/MainUi.cpp source/ui/MacroUi.cpp source/ui/FuncUi.cpp source/ui/EditUi.cpp source/ui/AboutUi.cpp`nHEADERS += source/src/*.h source/ui/*.h`nINCLUDEPATH += source source/src source/ui" | Set-Content buildtemp.pro -Encoding utf8

      - name: qmake生成构建文件
        run: qmake buildtemp.pro

      - name: nmake编译
        run: nmake

      - name: 部署Qt依赖
        run: windeployqt release\*.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-Win-x64
          path: release/**/*
