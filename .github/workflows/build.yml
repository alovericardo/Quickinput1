name: QuickInput‑CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows‑latest
    env:
      QT_VERSION: "6.7.2"
      QT_ARCH: "win64_msvc2022_64"
      QT_BASE: "D:\\Qt"
      VCPKG_ROOT: "D:\\vcpkg"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 加载MSVC编译环境
        uses: ilammy/msvc‑dev‑cmd@v1

      - name: 配置Python
        uses: actions/setup‑python@v5
        with:
          python‑version: "3.11"

      - name: 安装修复版aqtinstall
        run: |
          python -m pip install git+https://github.com/miurahr/aqtinstall.git@master

      - name: 下载Qt6.7.2
        run: |
          python -m aqt install‑qt windows desktop ${{env.QT_VERSION}} ${{env.QT_ARCH}} ‑O ${{env.QT_BASE}}
        env:
          AQT_CONFIG_MIRROR: "https://qt.mirror.constant.com"

      - name: 准备vcpkg包管理器
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{env.VCPKG_ROOT}}
          cd ${{env.VCPKG_ROOT}}
          .\bootstrap‑vcpkg.bat

      - name: 通过vcpkg安装OpenSSL x64‑windows
        run: |
          ${{env.VCPKG_ROOT}}\vcpkg.exe install openssl:x64‑windows

      - name: CMake配置项目（接入Qt + vcpkg‑OpenSSL）
        run: |
          cmake ‑B build ‑S source `
            ‑DCMAKE_PREFIX_PATH="${{env.QT_BASE}}\\${{env.QT_VERSION}}\\${{env.QT_ARCH}}" `
            ‑DCMAKE_TOOLCHAIN_FILE="${{env.VCPKG_ROOT}}\\scripts\\buildsystems\\vcpkg.cmake"

      - name: CMake编译Release
        run: cmake --build build --config Release

      - name: Qt部署windeployqt
        run: |
          $qtBin = "${{env.QT_BASE}}\\${{env.QT_VERSION}}\\${{env.QT_ARCH}}\\bin\\windeployqt.exe"
          & $qtBin build\Release\QuickInput.exe

      - name: 复制OpenSSL运行时dll到输出目录
        run: |
          Copy‑Item "${{env.VCPKG_ROOT}}\installed\x64‑windows\bin\*.dll" build\Release\

      - name: 上传编译产物
        uses: actions/upload‑artifact@v4
        with:
          name: QuickInput‑custom‑icon
          path: build/Release/**
