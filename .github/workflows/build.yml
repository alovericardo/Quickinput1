name: QuickInput 云端全量编译
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: 编译项目
        shell: powershell
        run: |
          msbuild QuickInput.sln /p:Configuration=Release /p:Platform=x64

      - name: 打包Qt依赖
        shell: powershell
        run: |
          windeployqt release/x64/QuickInput.exe

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: QuickInput-定制图标版
          path: release/x64/**
